name: CI / QA (DEV & PR Validation)

on:
  pull_request:
    branches:
      - pre
      - main

permissions:
  contents: read

jobs:
  ci-qa:
    name: ci-qa
    runs-on: ubuntu-latest

    services:
      wiremock:
        image: wiremock/wiremock:latest
        ports:
          - 8089:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest "moto[dynamodb]" boto3

      - name: Run unit & Moto integration tests
        run: pytest tests/ -v

      - name: Load WireMock stubs & run OAuth integration check
        env:
          INTERVALS_OAUTH_BASE_URL: "http://localhost:8089"
          INTERVALS_CLIENT_ID: "dev-client-id"
          INTERVALS_CLIENT_SECRET: "dev-secret"
          INTERVALS_WEBHOOK_SECRET: "dev-webhook-secret"
          ATHLETES_TABLE_NAME: "ATHLETES_DEV"
          ACTIVITIES_TABLE_NAME: "ACTIVITIES_DEV"
          AWS_REGION: "eu-west-1"
          GOAL_KM: "500"
          LAST_ACT: "10"
          TITLE: "DEV Counter"
          CHECKPOINTS: "100,250,400"
          ACT_TYPE_FILTER: ""
          ACT_TITLE_FILTER: ""
          START_DATE: ""
          CLUB_FILTER: ""
          API_KEY: ""
          API_SIGNING_SECRET: ""
          AUTH_TOLERANCE_SECONDS: "300"
          TOKEN_TTL_SECONDS: "300"
          RATE_LIMIT_MAX: "30"
          RATE_LIMIT_WINDOW: "60"
          CORS_ALLOWED_ORIGINS: "*"
        run: |
          curl -s -X POST http://localhost:8089/__admin/mappings/import \
            -H "Content-Type: application/json" \
            -d @mocks/wiremock/mappings/oauth-token.json
          python -c "from api.intervals_oauth import exchange_code_for_token; res = exchange_code_for_token('demo_code_1'); assert res['athlete_id'] == 'i_demo_01', res"

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies & verify build
        working-directory: frontend
        run: |
          npm ci
          npm run build

