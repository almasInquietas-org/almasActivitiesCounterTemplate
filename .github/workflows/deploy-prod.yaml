name: Deploy PROD (ClubCounterAPI-PROD)

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/deploy-prod.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy-prod:
    name: Test & Deploy to PROD
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest "moto[dynamodb]" boto3

      - name: Run full test suite before packaging
        run: pytest tests/ -v

      - name: Package zero-dependency Lambda zip
        run: |
          cd api
          zip -r ../function.zip . -x "*.env*" -x "*__pycache__*" -x "*.pyc"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy package to AWS Lambda (ClubCounterAPI-PROD)
        run: |
          aws lambda update-function-code \
            --function-name ClubCounterAPI-PROD \
            --zip-file fileb://function.zip \
            --region eu-north-1
          aws lambda wait function-updated-v2 \
            --function-name ClubCounterAPI-PROD \
            --region eu-north-1

