name: Deploy PROD (ClubCounterAPI-PROD)

on:
  push:
    branches:
      - master
    paths:
      - "api/**"
      - ".github/workflows/deploy-prod.yaml"
  workflow_dispatch:

jobs:
  test-and-deploy-prod:
    name: Test & Deploy to PROD
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest "moto[dynamodb]" boto3

      - name: Run full test suite before packaging
        run: pytest tests/ -v

      - name: Package zero-dependency Lambda zip
        run: |
          cd api
          zip -r ../function.zip . -x "*.env*" -x "*__pycache__*" -x "*.pyc"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy package to AWS Lambda (ClubCounterAPI-PROD)
        run: |
          aws lambda update-function-code \
            --function-name ClubCounterAPI-PROD \
            --zip-file fileb://function.zip \
            --region eu-west-1

