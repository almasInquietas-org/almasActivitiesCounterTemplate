name: Seed PRE Demo Data

on:
  push:
    branches:
      - pre
  workflow_dispatch:
    inputs:
      reset:
        description: "Wipe ATHLETES_PRE and ACTIVITIES_PRE before seeding"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  seed-pre-demo-data:
    name: Update PRE Demo Data
    runs-on: ubuntu-latest
    environment: pre

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install AWS SDK (boto3)
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Seed PRE demo athletes and past-week activities
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.reset }}" = "true" ]; then
            python scripts/seed_demo_data.py --env pre --reset
          else
            python scripts/seed_demo_data.py --env pre
          fi
